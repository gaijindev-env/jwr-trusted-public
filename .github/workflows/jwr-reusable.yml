name: jwr-reusable
on:
  workflow_call:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: mint and decode OIDC token
        run: |
          set -e
          JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=wif-lab-probe" | jq -r .value)
          echo "--- DECODED CALLER-CHAIN CLAIMS:"
          echo "$JWT" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{sub,repository,repository_id,repository_owner,job_workflow_ref,job_workflow_sha,ref,ref_type,event_name,workflow,workflow_ref}'
